<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="1020" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="640" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Voxline — System Architecture</text>
  <text x="640" y="58" text-anchor="middle" font-size="12" fill="#64748B">Real-time voice AI orchestrator · kind cluster · CPU inference</text>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(60, 975)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="14" cy="0" r="3" fill="#D97706"/>
    <text x="34" y="4" font-size="11" fill="#64748B">Hot path (NATS)</text>

    <line x1="170" y1="0" x2="198" y2="0" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="184" cy="0" r="3" fill="#4F46E5"/>
    <text x="204" y="4" font-size="11" fill="#64748B">Cold path (Kafka)</text>

    <line x1="350" y1="0" x2="378" y2="0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="384" y="4" font-size="11" fill="#64748B">Data store</text>

    <line x1="470" y1="0" x2="498" y2="0" stroke="#059669" stroke-width="2.5" stroke-dasharray="3,2"/>
    <text x="504" y="4" font-size="11" fill="#64748B">Streaming tokens</text>

    <rect x="620" y="-9" width="18" height="18" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="644" y="4" font-size="11" fill="#64748B">Latency target</text>
  </g>

  <!-- ===== LAYER 1: CLIENT ===== -->
  <g filter="url(#sh)">
    <rect x="530" y="80" width="220" height="52" rx="10" fill="#3B82F6"/>
    <text x="640" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="white">React UI</text>
    <text x="640" y="121" text-anchor="middle" font-size="10" fill="#BFDBFE">chat · tenant switcher · analytics</text>
  </g>

  <!-- Step ① UI → Gateway -->
  <line x1="640" y1="132" x2="640" y2="170" stroke="#D97706" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="650" y="139" width="72" height="16" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="686" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">WebSocket</text>
  <!-- Step number -->
  <circle cx="618" cy="150" r="10" fill="#D97706"/>
  <text x="618" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="white">1</text>

  <!-- ===== LAYER 2: GATEWAY ===== -->
  <g filter="url(#sh)">
    <rect x="430" y="175" width="420" height="58" rx="10" fill="#1E3A8A"/>
    <text x="640" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="white">API Gateway</text>
    <text x="640" y="220" text-anchor="middle" font-size="10" fill="#93C5FD">Node.js / TypeScript — WebSocket ↔ NATS bridge</text>
  </g>

  <!-- ===== REDIS (left) ===== -->
  <g filter="url(#sh)">
    <rect x="80" y="178" width="200" height="52" rx="10" fill="#7C3AED"/>
    <text x="180" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="white">Redis</text>
    <text x="180" y="218" text-anchor="middle" font-size="10" fill="#DDD6FE">rate limit · cache · session</text>
  </g>
  <line x1="280" y1="204" x2="430" y2="204" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ad)"/>
  <text x="355" y="197" text-anchor="middle" font-size="9" fill="#9CA3AF">rate check + cache lookup</text>

  <!-- Step ② Gateway → NATS -->
  <line x1="640" y1="233" x2="640" y2="282" stroke="#D97706" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="618" cy="258" r="10" fill="#D97706"/>
  <text x="618" y="262" text-anchor="middle" font-size="9" font-weight="700" fill="white">2</text>

  <!-- ===== LAYER 3: NATS BUS ===== -->
  <g filter="url(#sh)">
    <rect x="140" y="287" width="1000" height="48" rx="10" fill="#F59E0B"/>
    <text x="640" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="white">NATS</text>
    <text x="640" y="326" text-anchor="middle" font-size="10" fill="#451A03" font-weight="500">voxline.{tenantId}.inbound → .intent.* → .llm.response → .outbound</text>
  </g>

  <!-- NATS latency badge -->
  <rect x="40" y="296" width="90" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="85" y="311" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">&lt;1ms / hop</text>

  <!-- ===== LAYER 4: SERVICES ===== -->

  <!-- Step ③ NATS → Intent Router -->
  <line x1="300" y1="335" x2="300" y2="400" stroke="#D97706" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="278" cy="368" r="10" fill="#D97706"/>
  <text x="278" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">3</text>

  <!-- Step ⑤ NATS → LLM Service -->
  <line x1="640" y1="335" x2="640" y2="400" stroke="#D97706" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="618" cy="368" r="10" fill="#D97706"/>
  <text x="618" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">5</text>

  <!-- Step ⑧ NATS → Response Composer -->
  <line x1="1000" y1="335" x2="1000" y2="400" stroke="#D97706" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="978" cy="368" r="10" fill="#D97706"/>
  <text x="978" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">8</text>

  <!-- Intent Router box -->
  <g filter="url(#sh)">
    <rect x="180" y="405" width="240" height="68" rx="10" fill="#0C4A6E"/>
    <text x="300" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="white">Intent Router</text>
    <text x="300" y="448" text-anchor="middle" font-size="10" fill="#BAE6FD">Node.js / TypeScript</text>
    <text x="300" y="464" text-anchor="middle" font-size="10" fill="#7DD3FC">classify → route by NATS subject</text>
  </g>

  <!-- LLM Service box -->
  <g filter="url(#sh)">
    <rect x="510" y="405" width="260" height="68" rx="10" fill="#0C4A6E"/>
    <text x="640" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="white">LLM Service</text>
    <text x="640" y="448" text-anchor="middle" font-size="10" fill="#BAE6FD">Python / FastAPI</text>
    <text x="640" y="464" text-anchor="middle" font-size="10" fill="#7DD3FC">prompt · context · stream · LangChain</text>
  </g>

  <!-- Response Composer box -->
  <g filter="url(#sh)">
    <rect x="870" y="405" width="250" height="68" rx="10" fill="#0C4A6E"/>
    <text x="995" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="white">Response Composer</text>
    <text x="995" y="448" text-anchor="middle" font-size="10" fill="#BAE6FD">Node.js / TypeScript</text>
    <text x="995" y="464" text-anchor="middle" font-size="10" fill="#7DD3FC">assemble · dual-publish (NATS + Kafka)</text>
  </g>

  <!-- Step ④ Intent Router re-publishes to NATS -->
  <line x1="360" y1="405" x2="360" y2="335" stroke="#D97706" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="382" cy="368" r="10" fill="#D97706"/>
  <text x="382" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">4</text>

  <!-- Step ⑦ LLM Service streams back to NATS -->
  <line x1="710" y1="405" x2="710" y2="335" stroke="#059669" stroke-width="2.5" stroke-dasharray="3,2" marker-end="url(#ag)"/>
  <circle cx="732" cy="368" r="10" fill="#059669"/>
  <text x="732" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">7</text>

  <!-- Step ⑨ Response Composer → NATS (outbound) -->
  <line x1="940" y1="405" x2="940" y2="335" stroke="#D97706" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="962" cy="368" r="10" fill="#D97706"/>
  <text x="962" y="372" text-anchor="middle" font-size="9" font-weight="700" fill="white">9</text>

  <!-- Step ⑩ NATS → Gateway (return) -->
  <path d="M 1140 310 L 1175 310 L 1175 204 L 850 204" stroke="#059669" stroke-width="2.5" stroke-dasharray="3,2" fill="none" marker-end="url(#ag)"/>
  <circle cx="1175" cy="258" r="10" fill="#059669"/>
  <text x="1175" y="262" text-anchor="middle" font-size="8" font-weight="700" fill="white">10</text>

  <!-- Step ⑪ Gateway → UI (return) -->
  <path d="M 750 192 L 780 192 L 780 106 L 750 106" stroke="#059669" stroke-width="2.5" stroke-dasharray="3,2" fill="none" marker-end="url(#ag)"/>
  <circle cx="780" cy="150" r="10" fill="#059669"/>
  <text x="780" y="154" text-anchor="middle" font-size="8" font-weight="700" fill="white">11</text>

  <!-- ===== LAYER 5: OLLAMA ===== -->

  <!-- Step ⑥ LLM Service → Ollama -->
  <line x1="640" y1="473" x2="640" y2="530" stroke="#059669" stroke-width="2.5" marker-end="url(#ag)"/>
  <circle cx="618" cy="502" r="10" fill="#059669"/>
  <text x="618" y="506" text-anchor="middle" font-size="9" font-weight="700" fill="white">6</text>
  <text x="660" y="505" font-size="9" fill="#065F46" font-weight="500">/v1/chat/completions</text>

  <!-- Ollama box -->
  <g filter="url(#sh)">
    <rect x="450" y="535" width="380" height="90" rx="10" fill="#059669"/>
    <text x="640" y="558" text-anchor="middle" font-size="15" font-weight="600" fill="white">Ollama</text>
    <text x="640" y="576" text-anchor="middle" font-size="10" fill="#A7F3D0">OpenAI-compatible API · GGUF Q4_K_M · CPU inference</text>

    <!-- Two model boxes -->
    <rect x="470" y="590" width="155" height="26" rx="6" fill="#047857" stroke="#065F46" stroke-width="0.8"/>
    <text x="547" y="607" text-anchor="middle" font-size="11" font-weight="600" fill="#D1FAE5">Qwen 0.5B</text>

    <rect x="645" y="590" width="165" height="26" rx="6" fill="#047857" stroke="#065F46" stroke-width="0.8"/>
    <text x="727" y="607" text-anchor="middle" font-size="11" font-weight="600" fill="#D1FAE5">Qwen 1.5B</text>
  </g>

  <!-- Labels under models -->
  <text x="547" y="638" text-anchor="middle" font-size="9" fill="#64748B">intent classification</text>
  <text x="547" y="650" text-anchor="middle" font-size="9" fill="#64748B">30-60 tok/s · ~250 Mi</text>
  <text x="727" y="638" text-anchor="middle" font-size="9" fill="#64748B">conversation response</text>
  <text x="727" y="650" text-anchor="middle" font-size="9" fill="#64748B">25-45 tok/s · ~750 Mi</text>

  <!-- Intent Router → Ollama (classification) dashed -->
  <path d="M 240 473 L 240 555 L 450 555" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ag)"/>
  <text x="340" y="548" font-size="9" fill="#065F46" font-weight="500">classify (0.5B)</text>

  <!-- Ollama TTFT badge -->
  <rect x="840" y="558" width="130" height="22" rx="11" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="905" y="573" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">TTFT: 100-300ms</text>

  <!-- Classification latency badge -->
  <rect x="140" y="540" width="90" height="22" rx="11" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="185" y="555" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">&lt;200ms</text>

  <!-- ===== MONGODB (right side) ===== -->
  <g filter="url(#sh)">
    <rect x="1070" y="505" width="180" height="52" rx="10" fill="#7C3AED"/>
    <text x="1160" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="white">MongoDB</text>
    <text x="1160" y="545" text-anchor="middle" font-size="10" fill="#DDD6FE">conversations · tenants · analytics</text>
  </g>

  <!-- LLM Service → MongoDB (context load) -->
  <path d="M 770 450 L 840 450 L 840 525 L 1070 525" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ad)"/>
  <text x="870" y="492" font-size="9" fill="#9CA3AF">load context</text>

  <!-- Response Composer → MongoDB (write turn — async) -->
  <path d="M 1050 473 L 1050 525 L 1070 525" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ad)"/>
  <text x="1058" y="498" font-size="9" fill="#9CA3AF">write turn (async)</text>

  <!-- ===== KAFKA (cold path) ===== -->
  <g filter="url(#sh)">
    <rect x="870" y="690" width="200" height="52" rx="10" fill="#4F46E5"/>
    <text x="970" y="713" text-anchor="middle" font-size="14" font-weight="600" fill="white">Kafka</text>
    <text x="970" y="730" text-anchor="middle" font-size="10" fill="#C7D2FE">KRaft · voxline.events · durable</text>
  </g>

  <!-- Response Composer → Kafka (fire-and-forget) -->
  <path d="M 995 473 L 995 530 L 970 530 L 970 690" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#ac)"/>
  <text x="945" y="600" font-size="9" fill="#4338CA" font-weight="500">async publish</text>
  <text x="945" y="612" font-size="9" fill="#4338CA">(fire-and-forget)</text>

  <!-- ===== ANALYTICS WORKER ===== -->
  <g filter="url(#sh)">
    <rect x="870" y="790" width="200" height="52" rx="10" fill="#0C4A6E"/>
    <text x="970" y="813" text-anchor="middle" font-size="13" font-weight="600" fill="white">Analytics Worker</text>
    <text x="970" y="829" text-anchor="middle" font-size="10" fill="#BAE6FD">Python · Kafka consumer</text>
  </g>

  <!-- Kafka → Analytics Worker -->
  <line x1="970" y1="742" x2="970" y2="790" stroke="#4F46E5" stroke-width="2" marker-end="url(#ac)"/>

  <!-- Analytics Worker → MongoDB -->
  <path d="M 1070 816 L 1160 816 L 1160 557" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ad)"/>
  <text x="1185" y="700" font-size="9" fill="#9CA3AF" transform="rotate(90,1185,700)">write metrics</text>

  <!-- ===== LLM Service → Redis (cache check) ===== -->
  <path d="M 510 440 L 280 300 L 280 230" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ad)"/>
  <text x="370" y="340" font-size="9" fill="#9CA3AF">cache check</text>

  <!-- ===== E2E LATENCY BADGES ===== -->
  <rect x="130" y="82" width="200" height="48" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="230" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">End-to-End Targets</text>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#B91C1C">TTFT &lt;500ms · Full: 1-3s</text>

  <!-- ===== HOT PATH FLOW SUMMARY ===== -->
  <g transform="translate(60, 690)">
    <rect x="0" y="0" width="720" height="160" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#0F172A">Hot Path Flow (steps 1-11)</text>

    <text x="20" y="48" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">①</tspan> UI → Gateway (WebSocket)
    </text>
    <text x="20" y="66" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">②</tspan> Gateway → NATS (.inbound)
    </text>
    <text x="20" y="84" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">③</tspan> NATS → Intent Router
    </text>
    <text x="20" y="102" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">④</tspan> Intent Router → NATS (.intent.*) — classifies via Qwen 0.5B
    </text>
    <text x="20" y="120" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">⑤</tspan> NATS → LLM Service
    </text>
    <text x="20" y="138" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#059669">⑥</tspan> LLM Service → Ollama (Qwen 1.5B) — generates response
    </text>

    <text x="380" y="48" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#059669">⑦</tspan> LLM Service streams tokens → NATS (.llm.response)
    </text>
    <text x="380" y="66" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">⑧</tspan> NATS → Response Composer
    </text>
    <text x="380" y="84" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#D97706">⑨</tspan> Response Composer → NATS (.outbound)
    </text>
    <text x="380" y="102" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#059669">⑩</tspan> NATS → Gateway (stream)
    </text>
    <text x="380" y="120" font-size="11" fill="#64748B">
      <tspan font-weight="600" fill="#059669">⑪</tspan> Gateway → UI (WebSocket stream)
    </text>
    <text x="380" y="145" font-size="10" font-weight="600" fill="#991B1B">Total NATS hops: 5 × &lt;1ms = &lt;5ms overhead</text>
  </g>

  <!-- ===== KUBERNETES NAMESPACE BOUNDARY ===== -->
  <rect x="30" y="72" width="1220" height="870" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="38" y="65" width="210" height="20" rx="4" fill="#F8FAFC"/>
  <text x="48" y="79" font-size="11" fill="#94A3B8" font-weight="500">namespace: voxline (kind cluster)</text>
</svg>
